name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # El validador de contenido se prueba desde los tests de la app (tests/validador.test.ts),
      # y ese test FALLA a propósito si a Python le faltan jsonschema o music21: es lo que
      # evita que el validador «pase» sin comprobar nada. Sin este paso, la tarea fallaba en
      # cada push y llenaba el correo de avisos.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r tools/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Presupuesto de peso del arranque
        run: node tools/presupuesto.mjs

  contenido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Validar todas las actividades
        run: python tools/validar.py content/actividades --estricto
