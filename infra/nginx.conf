server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras que hay que replicar en Cloudflare Pages (fichero _headers).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), interest-cohort=()" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(opus|woff2|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
